name: Astrea Check

on:
  push:
    branches:
      - main
  pull_request:
  workflow_dispatch:

jobs:
  render-engine:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Install ffmpeg and CJK font
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends ffmpeg fonts-noto-cjk

      - name: Install Pillow
        run: python3 -m pip install --upgrade pillow

      - name: Render engine unit tests
        working-directory: integrations/mac-worker
        run: python3 -m unittest discover -s export -p "test_*.py" -v
