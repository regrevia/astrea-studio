# ⚠️ 这是「上游模板」，不是运行时配置。不要直接 docker compose up。
#
# 运行时配置由 deploy/render_config.py 从本文件生成到 ~/CreatorStudio/config/compose.yml
# （去掉固定 container_name/网络名，改用 ${STUDIO_IMAGE_*} 变量，加 pull_policy: never）。
#
# 正确用法：
#   1) 改本文件（镜像 / 环境 / 端口 / 依赖）
#   2) python3 deploy/render_config.py
#   3) cd ~/CreatorStudio/config && docker compose --env-file compose.env -f compose.yml --project-name creatorstudio up -d
#
# 直接在本目录 compose up 会：① 用固定容器名 aitoearn-*，与在跑的 creatorstudio-* 抢端口；
# ② 绕过凭据渲染。本机 Docker Hub 不可达，但此处镜像名已全部指向本地，故不会触发拉取。
services:
  mongodb:
    image: ${STUDIO_IMAGE_MONGO:-creator-studio/mongo:7.0}
    pull_policy: missing
    container_name: aitoearn-mongodb
    restart: unless-stopped
    # keyfile 必须落在持久化卷里：放在 /data（rootfs）会在每次 recreate 后重新生成，
    # 与已有 dbpath 的副本集密钥不匹配，mongod 直接启动失败。
    entrypoint: ["/bin/sh", "-c", "if [ ! -f /data/configdb/mongodb-keyfile ]; then openssl rand -base64 756 > /data/configdb/mongodb-keyfile && chmod 400 /data/configdb/mongodb-keyfile && chown mongodb:mongodb /data/configdb/mongodb-keyfile; fi; exec docker-entrypoint.sh mongod --replSet rs0 --keyFile /data/configdb/mongodb-keyfile"]
    environment:
      MONGO_INITDB_ROOT_USERNAME: ${STUDIO_MONGO_ROOT_USERNAME:-admin}
      MONGO_INITDB_ROOT_PASSWORD: ${STUDIO_MONGO_ROOT_PASSWORD:-password}
    ports:
      - "127.0.0.1:27017:27017"
    volumes:
      - mongodb-data:/data/db
      - mongodb-config:/data/configdb
    networks:
      - aitoearn-network
    healthcheck:
      # mongosh 在这台机器上跑不起来（node 二进制问题），健康检查只用 TCP 探活：
      # 副本集是否已成为 primary 由 mongodb-rs-init 负责，不挂在健康检查上。
      test: ["CMD-SHELL", "bash -c 'exec 3<>/dev/tcp/127.0.0.1/27017'"]
      interval: 10s
      timeout: 5s
      retries: 10
      start_period: 40s

  mongodb-rs-init:
    image: ${STUDIO_IMAGE_MONGO:-creator-studio/mongo:7.0}
    pull_policy: missing
    container_name: aitoearn-mongodb-rs-init
    depends_on:
      mongodb:
        condition: service_started
    entrypoint: ["/bin/sh", "-c", "until mongosh mongodb://admin:password@mongodb:27017/?authSource=admin --quiet --eval \"db.adminCommand('ping').ok\" >/dev/null 2>&1; do sleep 2; done; mongosh mongodb://admin:password@mongodb:27017/?authSource=admin --eval \"try { rs.initiate({_id:'rs0', members:[{_id:0, host:'mongodb:27017'}]}) } catch(e) { if (e.codeName!=='AlreadyInitialized') throw e }\""]
    restart: "no"
    networks:
      - aitoearn-network

  redis:
    image: ${STUDIO_IMAGE_REDIS:-creator-studio/redis:7-alpine}
    pull_policy: missing
    container_name: aitoearn-redis
    restart: unless-stopped
    # 必须 --appendonly yes：默认 RDB-only，容器被杀会丢最近写入。
    # redis-cli 的健康检查要走 REDISCLI_AUTH，否则在 --requirepass 下永远返回 NOAUTH。
    command: ["redis-server", "--requirepass", "${STUDIO_REDIS_PASSWORD:-password}", "--appendonly", "yes"]
    environment:
      REDISCLI_AUTH: ${STUDIO_REDIS_PASSWORD:-password}
    ports:
      - "127.0.0.1:6379:6379"
    volumes:
      - redis-data:/data
    networks:
      - aitoearn-network
    healthcheck:
      test: ["CMD-SHELL", "test \"$$(redis-cli --raw ping)\" = PONG"]
      interval: 10s
      timeout: 3s
      retries: 5
      start_period: 30s

  rustfs:
    # 服务名 / 容器名 / rustfs.local 别名保持不变（后端配置与 nginx 都按这些名字写死）。
    # 实现换成 S3 兼容的 versitygw：rustfs 官方镜像里的二进制在这台 Docker VM 上
    # 任何调用都 SIGSEGV（`rustfs --version` 也是 rc=139，跟 node:24 同类问题），
    # 官方镜像与本地镜像的二进制 sha256 完全一致，所以不是打包问题。
    # versitygw 的 posix 后端依赖 extended attributes：数据卷只能用 named volume，
    # 绑定宿主机目录会因为 xattr 不支持直接起不来。
    image: ${STUDIO_IMAGE_RUSTFS:-creator-studio/s3:local}
    pull_policy: missing
    container_name: aitoearn-rustfs
    hostname: rustfs.local
    restart: unless-stopped
    # 先确保 bucket 目录存在（posix 后端把 bucket 映射成一级目录），再起网关。
    entrypoint: ["/bin/sh", "-c", "mkdir -p /data/aitoearn && exec /usr/local/bin/versitygw posix /data"]
    environment:
      VGW_PORT: ":9000"
      # 9001 给 WebUI，端口映射沿用原来的 9001。
      VGW_WEBUI_PORT: ":9001"
      ROOT_ACCESS_KEY: rustfsadmin
      ROOT_SECRET_KEY: rustfsadmin
    ports:
      - "9001:9001"
    volumes:
      - rustfs-data:/data
    networks:
      aitoearn-network:
        aliases:
          - rustfs.local
          # render 后的 compose 会去掉 container_name，而 nginx 的 /oss 反代写的是
          # 容器名 aitoearn-rustfs，所以这里补上同样的网络别名。
          - aitoearn-rustfs
    healthcheck:
      # 匿名 GET / 一律 403（wget 退出码 1，不是 8），/health 是 404，只有 WebUI
      # 的 9001 有一个稳定的 200。健康检查打 WebUI：网关进程活着且 HTTP 栈可用。
      test: ["CMD-SHELL", "wget -q -O /dev/null http://127.0.0.1:9001/"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 30s

  aitoearn-init:
    image: ${STUDIO_IMAGE_NODE:-creator-studio/node:22-alpine}
    pull_policy: missing
    container_name: aitoearn-init
    restart: "no"
    depends_on:
      mongodb:
        condition: service_healthy
    volumes:
      - ./scripts/init.mjs:/app/init.mjs:ro
      - ./scripts/init-package.json:/app/package.json:ro
      - init-data:/data/init
    working_dir: /app
    environment:
      MONGO_URI: mongodb://admin:password@mongodb:27017
      JWT_SECRET: change-this-jwt-secret
      DB_NAME: aitoearn
      AUTO_LOGIN_TOKEN_PATH: /data/init/token.txt
    entrypoint: /bin/sh -c "npm install --omit=dev 2>/dev/null && node init.mjs"
    networks:
      - aitoearn-network

  rustfs-init:
    # 本机没有 minio/mc 镜像且 Docker Hub 不可达；bucket 早已建好，故默认不跑。
    # 需要时：docker compose --profile init up rustfs-init
    profiles: ["init"]
    image: ${STUDIO_IMAGE_MC:-minio/mc:latest}
    pull_policy: missing
    container_name: aitoearn-rustfs-init
    depends_on:
      rustfs:
        condition: service_healthy
    networks:
      - aitoearn-network
    entrypoint: >
      /bin/sh -c "
      mc alias set rustfs http://rustfs.local:9000 rustfsadmin rustfsadmin;
      mc mb rustfs/aitoearn --ignore-existing;
      mc anonymous set download rustfs/aitoearn;
      exit 0;
      "

  aitoearn-ai:
    image: ${STUDIO_IMAGE_AI:-creator-studio/aitoearn-ai:local}
    pull_policy: never
    container_name: aitoearn-ai
    restart: unless-stopped
    depends_on:
      mongodb:
        condition: service_healthy
      redis:
        condition: service_healthy
    volumes:
      - ./project/aitoearn-backend/apps/aitoearn-ai/config/config.yaml:/app/config.yaml:rw
    networks:
      - aitoearn-network
    healthcheck:
      test: ["CMD", "node", "-e", "require('http').get('http://localhost:3010/health', (r) => { process.exit(r.statusCode === 200 ? 0 : 1) })"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 60s

  aitoearn-server:
    image: ${STUDIO_IMAGE_SERVER:-creator-studio/aitoearn-server:local}
    pull_policy: missing
    container_name: aitoearn-server
    restart: unless-stopped
    depends_on:
      mongodb:
        condition: service_healthy
      redis:
        condition: service_healthy
      aitoearn-ai:
        condition: service_healthy
    volumes:
      - ./project/aitoearn-backend/apps/aitoearn-server/config/config.yaml:/app/config.yaml:rw
    networks:
      - aitoearn-network
    healthcheck:
      test: ["CMD", "node", "-e", "require('http').get('http://localhost:3002/health', (r) => { process.exit(r.statusCode === 200 ? 0 : 1) })"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 60s

  aitoearn-web:
    image: ${STUDIO_IMAGE_WEB:-creator-studio/aitoearn-web:local}
    pull_policy: missing
    container_name: aitoearn-web
    restart: unless-stopped
    depends_on:
      aitoearn-server:
        condition: service_healthy
      aitoearn-init:
        condition: service_completed_successfully
    volumes:
      - init-data:/data/init:ro
    networks:
      - aitoearn-network
    command: ["/bin/sh", "-c", "AUTO_LOGIN_TOKEN=$$(cat /data/init/token.txt 2>/dev/null || true); if [ -z \"$$AUTO_LOGIN_TOKEN\" ]; then echo 'AUTO_LOGIN_TOKEN is missing. Check the aitoearn-init container logs.' >&2; exit 1; fi; export AUTO_LOGIN_TOKEN; exec node server.js"]
    environment:
      NODE_ENV: production
      NEXT_TELEMETRY_DISABLED: 1
    healthcheck:
      test: ["CMD", "node", "-e", "require('http').get('http://localhost:3000', (r) => { process.exit(r.statusCode < 500 ? 0 : 1) }).on('error', () => process.exit(1))"]
      interval: 10s
      timeout: 5s
      retries: 6
      start_period: 30s

  nginx:
    image: ${STUDIO_IMAGE_NGINX:-creator-studio/nginx:alpine}
    pull_policy: missing
    container_name: aitoearn-nginx
    restart: unless-stopped
    depends_on:
      aitoearn-web:
        condition: service_healthy
      aitoearn-server:
        condition: service_healthy
      aitoearn-ai:
        condition: service_healthy
    ports:
      - "8080:80"
      - "9000:9000"
    volumes:
      - ./nginx/nginx.conf:/etc/nginx/nginx.conf:ro
    networks:
      - aitoearn-network
    healthcheck:
      test: ["CMD", "wget", "--no-verbose", "--tries=1", "--spider", "http://localhost/_nhealth"]
      interval: 10s
      timeout: 5s
      retries: 3
      start_period: 10s

networks:
  aitoearn-network:
    driver: bridge
    name: aitoearn-network

volumes:
  mongodb-data:
    driver: local
  mongodb-config:
    driver: local
  redis-data:
    driver: local
  rustfs-data:
    driver: local
  init-data:
    driver: local
